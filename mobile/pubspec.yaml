name: sigma_t
description: SIGMA-T - App para choferes del Sistema Integral de Gestión para MiPYME de Transporte
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  dio: ^5.3.3
  provider: ^6.0.5
  flutter_secure_storage: ^9.0.0
  signature: ^5.4.0
  image_picker: ^1.0.5
  flutter_map: ^6.0.0
  url_launcher: ^6.2.1
  flutter_local_notifications: ^15.1.1
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.0.1
  geolocator: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/